<div class="publication-card">

<h2>{{post.title}}</h2>

<p>
<strong>{{post.venue}}</strong>
({{post.date | date:"%Y"}})
</p>

<p>{{post.authors}}</p>

<p>{{post.summary}}</p>

<p>

{% for keyword in post.keywords %}

<span class="tag">{{keyword}}</span>

{% endfor %}

</p>

<p>

<a href="{{post.paperurl}}">PDF</a>

|

<a href="https://doi.org/{{post.doi}}">DOI</a>

|

<a href="{{post.bibtexurl}}">BibTeX</a>

|

<a href="{{post.githuburl}}">Code</a>

</p>

</div>
